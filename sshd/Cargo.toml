[package]
name = "sshd"
version = "0.1.0"
edition = "2021"
publish = false
description = "kindil's SSH server on the Kindle: keys only, exec and shells"
license = "MIT"

[[bin]]
name = "kindil-sshd"
path = "src/main.rs"

# Small on purpose: russh's server (upstream, with its ring backend; ring's
# C is built by the same cross compiler as kindil's), tokio on one thread,
# and libc for the pseudo-terminal.
[dependencies]
bytes = "1"
# 0.4, like russh's: on musl it falls back to /dev/urandom when the kernel
# has no getrandom() (the PW1's 2.6.31).
getrandom = "0.4"
libc = "0.2"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "process", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.27"
libc = "0.2"

