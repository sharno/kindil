name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features libm -- -D warnings
      - run: cargo test --all-features
      # The property tests and the differential tests against Adhan and
      # NOAA, at full speed.
      - run: cargo test --release --all-features
      - run: cargo test --no-default-features --features libm
      # no_std: a microcontroller target, without std or an allocator.
      - run: cargo build --no-default-features --features libm,serde --target thumbv7em-none-eabihf
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest Rust the crate takes (rust-version), whose core lacks f64's
  # math: the libm path.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --no-default-features --features libm --target thumbv7em-none-eabihf
      - run: cargo test --lib

  # The Verus proofs of the integer core (VERIFICATION.md).
  verus:
    runs-on: ubuntu-latest
    env:
      VERUS_RELEASE: 0.2026.11.02.8bf68ee
    steps:
      - uses: actions/checkout@v4
      - name: Install Verus and its Rust toolchain
        run: |
          curl -sfLO "https://github.com/verus-lang/verus/releases/download/release/$VERUS_RELEASE/verus-$VERUS_RELEASE-x86-linux.zip"
          unzip -q "verus-$VERUS_RELEASE-x86-linux.zip"
          rustup install "$(jq -r '.verus.toolchain' verus-x86-linux/version.json | cut -d' ' -f1)"
      - run: verus-x86-linux/verus src/verified.rs --crate-type=lib

  # The Kani proofs (VERIFICATION.md).
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: cargo kani -Z stubbing
