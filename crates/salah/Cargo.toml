[package]
name = "salah"
version = "0.7.6"
authors = ["Farhan Ahmed <farhan@themacronaut.com>", "salah-rs contributors"]
edition = "2024"
rust-version = "1.87"
description = "Islamic prayer time library for Rust"
homepage = "https://github.com/sharno/salah-rs"
repository = "https://github.com/sharno/salah-rs"
readme = "README.md"
exclude = ["tests/fixtures"]
keywords = ["salah", "pray", "islam", "reminder", "adhan"]
categories = ["date-and-time"]
license = "MIT"
# A fork of insha/salah: not on crates.io, so it can't be mistaken for the
# original there. Depend on it by git or as a vendored subtree.
publish = false

[dev-dependencies]
# Formatting times in tests, with or without std.
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
proptest = "1"
serde_json = "1"

[dependencies]
chrono = { version = "0.4.42", default-features = false }
# The trigonometry without std (no_std, the default `std` feature off).
libm = { version = "0.2.11", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[features]
default = ["std"]
std = ["chrono/std"]
# Without std, the math comes from libm: `default-features = false,
# features = ["libm"]`.
libm = ["dep:libm"]
serde = ["dep:serde", "chrono/serde"]

[lints.rust]
# Kani's proofs are built under cfg(kani): see VERIFICATION.md.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
