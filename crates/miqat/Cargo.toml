[package]
name = "miqat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
resvg = "0.50"
# Prayer times; kindil carries tawqit as a subtree (crates/tawqit) and
# patches this to it. jiff is its types', without a time zone database
# (chrono-tz's stays the one: see prayer.rs's bridge).
tawqit = { git = "https://github.com/sharno/tawqit" }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.2.1"
ureq = { version = "3", features = ["json"] }
