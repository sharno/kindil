[package]
name = "miqat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
resvg = "0.50"
# The salah-rs fork; kindil carries it as a subtree (crates/salah) and
# patches this to it.
salah = { git = "https://github.com/sharno/salah-rs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.2.1"
ureq = { version = "3", features = ["json"] }
