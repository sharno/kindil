# Starts kindil at boot (https://github.com/sharno/kindil). This is the one
# file kindil adds to the system, and it only hands over to boot.sh on the
# user storage, which does nothing unless /mnt/us/kindil/BOOT exists.
# To undo: mntroot rw; rm /etc/upstart/kindil.conf; mntroot ro
description "kindil at boot"
# volumd starts with powerd and wifid, the services kindil uses, and before
# X and Amazon's UI are up: a standalone boot then never starts them.
start on started volumd
task
script
  BOOT=/mnt/us/extensions/kindil/bin/boot.sh
  [ -f "$BOOT" ] || exit 0
  mkdir -p /var/local/kindil
  /bin/sh "$BOOT" >>/var/local/kindil/kindil.log 2>&1 </dev/null &
end script
