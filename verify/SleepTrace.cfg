\* For traces of the app recorded by the UI tests (everystate conform -hidden 3):
\* the button, idle, the battery and volumd at any time; the app's own timers and
\* workers, the host's naps and sleeps as modelled. Races, USB, holds and the
\* light on. Not model-checked (it holds, 10 M states, 90 s).
\* everystate -config SleepTrace.cfg Sleep.tla
SPECIFICATION Spec
CONSTANTS
  OpenWorld = FALSE
  ExternalOpen = TRUE
  Power = FALSE
  Drawing = FALSE
  Holds = TRUE
  Usb = TRUE
  Lights = TRUE
  IdleSleeps = TRUE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = TRUE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 2
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
