  OpenWorld = FALSE
  ExternalOpen = FALSE
  Power = TRUE
  Drawing = FALSE
  Holds = FALSE
  Usb = FALSE
  Lights = TRUE
  IdleSleeps = TRUE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = FALSE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 2
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES PluggedLeavesLowBattery PluggedStaysOffLowBattery
