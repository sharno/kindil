\* Sleeping, the button, the battery and the charger, a doze wake abstracted to its
\* ceiling. Holds. Its properties include those of SleepCharger and SleepRefused,
\* the findings of 0.15.0 these configurations once kept apart (see
\* docs/DEVELOP.md, "Formal models").
\* everystate -config Sleep.cfg Sleep.tla
SPECIFICATION Spec
CONSTANTS
  OpenWorld = FALSE
  ExternalOpen = FALSE
  Power = TRUE
  Drawing = FALSE
  Holds = FALSE
  Usb = FALSE
  Lights = FALSE
  IdleSleeps = TRUE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = FALSE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 2
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SuspendedOnlyWhenAppSleeps AlarmUnlessAsleep CheckedAsleepOnBattery OneSuspendAtATime ClaimedFrameIsOnPanel PressNotTakenForAlarm
PROPERTIES PressWakes WakeEnds DozeKeepsRedrawing PluggedLeavesLowBattery
  PluggedStaysOffLowBattery LowBatterySleepSuspends
