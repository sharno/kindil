  OpenWorld = FALSE
  Power = TRUE
  Drawing = FALSE
  Holds = FALSE
  Usb = FALSE
  Lights = TRUE
  IdleSleeps = TRUE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = TRUE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 2
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS SuspendedOnlyWhenAppSleeps
