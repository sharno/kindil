\* Races: a press (or a computer) handled while a nap's or sleep's thread parks
\* Wi-Fi or returns, or before a short nap's timer. Failed on 0.15.0: the thread
\* suspended anyway, behind an awake app. The app now voids the suspend's ticket
\* when it leaves a nap or sleep (src/suspend.rs Gate), and drops what a void
\* one reports. Holds.
\* everystate -config SleepRaces.cfg Sleep.tla
SPECIFICATION Spec
CONSTANTS
  OpenWorld = FALSE
  ExternalOpen = FALSE
  Power = FALSE
  Drawing = FALSE
  Holds = FALSE
  Usb = FALSE
  Lights = FALSE
  IdleSleeps = TRUE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = TRUE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 1
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SuspendedOnlyWhenAppSleeps AlarmUnlessAsleep OneSuspendAtATime PressNotTakenForAlarm
PROPERTIES PressWakes
