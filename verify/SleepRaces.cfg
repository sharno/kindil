\* FAILS on 0.15.0: a press (or a computer) handled while a nap's or sleep's thread
\* parks Wi-Fi: the thread suspends anyway, behind an awake app.
\* everystate -config SleepRaces.cfg Sleep.tla
SPECIFICATION Spec
