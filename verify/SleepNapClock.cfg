\* A nap lasts until its minute. Failed on 0.15.0: an online wake's sync that
\* landed while the next nap parked Wi-Fi stepped the clock back under it, and
\* the nap overshot by the step; its end is now a monotonic deadline fixed when
\* the nap is planned (system::nap_deadline). Holds.
\* everystate -config SleepNapClock.cfg Sleep.tla
SPECIFICATION Spec
CONSTANTS
  OpenWorld = FALSE
  ExternalOpen = FALSE
  Power = FALSE
  Drawing = TRUE
  Holds = TRUE
  Usb = FALSE
  Lights = TRUE
  IdleSleeps = FALSE
  LowBattery = TRUE
  CableWakes = TRUE
  Races = FALSE
  PressNearAlarm = FALSE
  AlarmCanFail = FALSE
  MaxPending = 2
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS NapsEndOnTheMinute
