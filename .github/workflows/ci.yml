name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        kind: [host, arm]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Miqat revision
        id: miqat
        run: echo "rev=$(git ls-tree HEAD crates/miqat | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Fetch private Miqat library with its dedicated read-only key
        uses: actions/checkout@v4
        with:
          repository: sharno/miqat
          ref: ${{ steps.miqat.outputs.rev }}
          path: crates/miqat
          ssh-key: ${{ secrets.MIQAT_READ_KEY }}
          persist-credentials: false
      - run: git submodule init
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.kind }}
      - name: Host regression and lint
        if: matrix.kind == 'host'
        run: |
          nix flake check --no-build
          nix develop --command bash -euo pipefail -c '
            cargo fmt --check
            cargo test --locked
            cargo clippy --locked --all-targets --features kindle -- -D warnings
          '
      - name: ARM runtime tests and static device artifact
        if: matrix.kind == 'arm'
        run: |
          nix develop --command bash -euo pipefail -c '
            scripts/dev.sh test-arm
            scripts/dev.sh device
            qemu-arm dist/kindil --version
            bash scripts/test-initramfs.sh
          '
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'arm'
        with:
          name: kindil-arm-experimental
          path: dist/kindil
