name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        kind: [host, arm]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.kind }}
      - name: Host regression and lint
        if: matrix.kind == 'host'
        run: |
          nix flake check --no-build
          nix build --no-link .#kindil
          nix develop --command bash -euo pipefail -c '
            cargo fmt --check
            cargo test --locked
            tests/launcher.sh
            tests/boot.sh
            cargo clippy --locked --all-targets --features kindle -- -D warnings
          '
      - name: ARM runtime tests and static device artifact
        if: matrix.kind == 'arm'
        run: |
          nix develop --command bash -euo pipefail -c '
            scripts/dev.sh test-arm
            device=$(nix build --no-link --print-out-paths .#kindil-device)
            mkdir -p dist
            cp "$device/bin/kindil" dist/kindil
            qemu-arm dist/kindil --version
          '
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'arm'
        with:
          name: kindil-arm
          path: dist/kindil
