name: Release
# Publishing a GitHub release (tag vX.Y.Z, matching Cargo.toml) builds the
# static ARM binary, signs it with the key kindil checks updates against
# (src/update.rs), and attaches both to the release for over-the-air updates.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build and check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          device=$(nix build --no-link --print-out-paths .#kindil-device)
          mkdir -p dist
          cp "$device/bin/kindil" dist/kindil
          reported=$(nix shell nixpkgs#qemu -c qemu-arm dist/kindil --version)
          test "$reported" = "kindil ${TAG#v}" || {
            echo "tag $TAG but the binary reports '$reported'"
            exit 1
          }
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/release.key"
          nix shell nixpkgs#minisign -c minisign -S -s "$RUNNER_TEMP/release.key" \
            -m dist/kindil -x dist/kindil.minisig -t "kindil $TAG"
          rm "$RUNNER_TEMP/release.key"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/kindil dist/kindil.minisig --clobber
