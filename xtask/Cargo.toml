[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "kindil's development and device tasks: cargo xtask <task>"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
flate2 = "1.1"
minisign-verify = "0.2"
sha2 = "0.10"
tar = "0.4"
ureq = "3"

[dev-dependencies]
tempfile = "3.27"
