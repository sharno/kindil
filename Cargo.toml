[package]
name = "kindil"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "A single-process Rust shell for the first-generation Amazon Kindle Paperwhite"
license = "MIT"
publish = false

# No external crates: every dependency would have to be vendored and
# cross-compiled for the device. The C library surface we need is small and
# declared by hand in `sys.rs`, and the ABI is checked by tests that run on the
# real ARM target under qemu.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
